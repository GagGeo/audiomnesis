<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-label="Audiomnesis — aperçu de l'application">
  <defs>
    <clipPath id="card"><rect x="2" y="2" width="896" height="796" rx="14"/></clipPath>
  </defs>
  <style>
    .sans  { font-family: 'DM Sans','Helvetica Neue',Arial,sans-serif; }
    .serif { font-family: 'Newsreader','Iowan Old Style',Georgia,serif; }
    .mono  { font-family: 'JetBrains Mono','SF Mono',Menlo,monospace; }
  </style>

  <!-- window card -->
  <rect x="2" y="2" width="896" height="796" rx="14" fill="#F4EFE6" stroke="#D6CDB8" stroke-width="1.5"/>
  <g clip-path="url(#card)">
    <rect x="2" y="2" width="896" height="38" fill="#E9E1D2"/>
  </g>
  <line x1="2" y1="40" x2="898" y2="40" stroke="#D6CDB8"/>
  <circle cx="22" cy="21" r="6" fill="#C97B5C"/>
  <circle cx="40" cy="21" r="6" fill="#D5A24D"/>
  <circle cx="58" cy="21" r="6" fill="#4F8B7A"/>
  <text x="450" y="25" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#7B8580">AUDIOMNESIS — SESSION LOCALE</text>

  <!-- header: mark + wordmark -->
  <rect x="36" y="66" width="56" height="56" rx="14" fill="#2D5249"/>
  <g transform="translate(44,74) scale(0.4)">
    <rect x="30" y="24" width="40" height="52" rx="7" fill="none" stroke="#F4EFE6" stroke-width="5"/>
    <line x1="40" y1="34" x2="60" y2="34" stroke="#F4EFE6" stroke-width="3" stroke-linecap="round"/>
    <g fill="#C97B5C">
      <rect x="40" y="44" width="3" height="12" rx="1.5"/>
      <rect x="45.5" y="39" width="3" height="22" rx="1.5"/>
      <rect x="51" y="36" width="3" height="28" rx="1.5"/>
      <rect x="56.5" y="42" width="3" height="16" rx="1.5"/>
    </g>
  </g>
  <text x="106" y="100" class="serif" font-size="34" font-weight="500" fill="#1F2A26">Audiomnesis</text>
  <text x="107" y="119" class="mono" font-size="11.5" font-weight="600" letter-spacing="1">
    <tspan fill="#7B8580">TRANSCRIPTION &amp; PRÉ-RÉDACTION · </tspan><tspan fill="#2D5249">100 % LOCAL</tspan>
  </text>
  <!-- FR/EN switch -->
  <rect x="784" y="66" width="80" height="30" rx="9" fill="#F4EFE6" stroke="#D6CDB8"/>
  <rect x="787" y="69" width="37" height="24" rx="7" fill="#2D5249"/>
  <text x="805" y="85" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#F4EFE6">FR</text>
  <text x="844" y="85" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#7B8580">EN</text>

  <!-- transport toolbar -->
  <rect x="36" y="138" width="828" height="66" rx="11" fill="#EFE9DC" stroke="#D6CDB8"/>
  <rect x="48" y="150" width="164" height="42" rx="10" fill="#C97B5C"/>
  <circle cx="68" cy="171" r="5" fill="#F4EFE6"/>
  <text x="82" y="176" class="sans" font-size="15" font-weight="700" fill="#F4EFE6">Enregistrer</text>
  <text x="226" y="180" class="mono" font-size="24" font-weight="500" fill="#1F2A26">00:00</text>
  <line x1="316" y1="156" x2="316" y2="186" stroke="#D6CDB8"/>
  <rect x="328" y="150" width="176" height="42" rx="9" fill="#F4EFE6" stroke="#D6CDB8"/>
  <text x="416" y="176" text-anchor="middle" class="sans" font-size="13.5" font-weight="500" fill="#2E3F39">♪  Ouvrir un audio…</text>
  <rect x="512" y="150" width="172" height="42" rx="9" fill="#F4EFE6" stroke="#D6CDB8"/>
  <g stroke="#7B8580" stroke-width="1.6" fill="none" stroke-linecap="round">
    <rect x="528" y="163" width="12" height="16" rx="2"/>
    <line x1="531.5" y1="168" x2="536.5" y2="168"/>
    <line x1="531.5" y1="171.5" x2="536.5" y2="171.5"/>
    <line x1="531.5" y1="175" x2="534.5" y2="175"/>
  </g>
  <text x="548" y="176" class="sans" font-size="13.5" font-weight="500" fill="#2E3F39">Ouvrir un texte…</text>
  <rect x="698" y="153" width="154" height="36" rx="9" fill="#F4EFE6" stroke="#D6CDB8"/>
  <rect x="701" y="156" width="80" height="30" rx="7" fill="#2D5249"/>
  <text x="741" y="175" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#F4EFE6">Monsieur</text>
  <text x="817" y="175" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#7B8580">Madame</text>

  <!-- path fields -->
  <text x="36" y="245" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#7B8580">MODÈLE</text>
  <rect x="112" y="220" width="698" height="42" rx="9" fill="#F4EFE6" stroke="#D6CDB8"/>
  <text x="128" y="246" class="mono" font-size="12.5" fill="#2E3F39">…/audiomnesis/docs/bilan-cr.docx</text>
  <rect x="822" y="220" width="42" height="42" rx="9" fill="#E9E1D2"/>
  <text x="843" y="246" text-anchor="middle" class="sans" font-size="16" fill="#7B8580">…</text>
  <text x="36" y="295" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#7B8580">SORTIE</text>
  <rect x="112" y="270" width="698" height="42" rx="9" fill="#F4EFE6" stroke="#D6CDB8"/>
  <text x="128" y="296" class="mono" font-size="12.5" fill="#2E3F39">…/Documents/CR-anamnese</text>
  <rect x="822" y="270" width="42" height="42" rx="9" fill="#E9E1D2"/>
  <text x="843" y="296" text-anchor="middle" class="sans" font-size="16" fill="#7B8580">…</text>

  <!-- status callout -->
  <rect x="36" y="326" width="828" height="44" rx="9" fill="#EAF0EC" stroke="#CFE0D6"/>
  <circle cx="56" cy="348" r="8" fill="#4F8B7A" opacity="0.18"/>
  <circle cx="56" cy="348" r="4.5" fill="#4F8B7A"/>
  <text x="70" y="353" class="sans" font-size="13.5" fill="#2E3F39"><tspan font-weight="600">Prêt.</tspan> Rappel : le patient doit avoir consenti à l'enregistrement.</text>

  <!-- transcript -->
  <text x="36" y="399" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#2D5249">TRANSCRIPTION — RELISEZ ET CORRIGEZ AVANT DE GÉNÉRER</text>
  <text x="864" y="399" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#7B8580">0 mots</text>
  <rect x="36" y="410" width="828" height="290" rx="11" fill="#FBF8F1" stroke="#D6CDB8"/>
  <text x="54" y="446" class="serif" font-size="16" fill="#A79F8C">La transcription apparaîtra ici. Démarrez un enregistrement ou ouvrez un fichier</text>
  <text x="54" y="472" class="serif" font-size="16" fill="#A79F8C">audio pour commencer…</text>

  <!-- footer -->
  <text x="36" y="746" class="serif" font-size="14" font-style="italic" fill="#7B8580">Traitement effectué localement — aucune donnée ne quitte cet appareil.</text>
  <rect x="612" y="716" width="252" height="46" rx="10" fill="#2D5249"/>
  <text x="738" y="745" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#F4EFE6">✎  Générer le compte-rendu</text>
</svg>
